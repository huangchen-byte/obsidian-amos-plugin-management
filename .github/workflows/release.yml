name: Release on version tag

# 打 tag 即发版：push 形如 0.7.0 的 tag → 校验 → 构建 → 创建正式 Release 并上传三个产物。
# 约定：版本号必须与 manifest.json 的 version 完全一致，且不带 v 前缀。
# 只匹配数字开头的 tag，避免误推 v0.7.0 之类的标签触发。
#
# 也支持手动运行（Actions → Release on version tag → Run workflow）：
# 适用场景是补发一次漏掉的 tag 事件，或仓库刚从 fork 启用 Actions。version 留空则用 tag 名，
# 手动运行时必填版本号，且对应 tag 必须已存在。

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，须与 manifest.json 一致且 tag 已推送（例如 0.7.0）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # 需要历史与 tag 才能找到上一个版本，用于生成 compare 链接。
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Resolve version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="$GITHUB_REF_NAME"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "准备发布 $VERSION"

      # 产物必须由源码重现：安装、构建、测试、比对，与 ci.yml 保持一致。
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Verify committed release assets did not change
        run: git diff --exit-code -- main.js manifest.json styles.css

      - name: Check version matches manifest and tag
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "发布版本 $VERSION 与 manifest.json 的 $MANIFEST_VERSION 不一致，已中止" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "本地没有 tag $VERSION，请先 git push origin $VERSION" >&2
            exit 1
          fi

      # 正文取自 CHANGELOG.md 的对应段落；缺失或为空时直接失败，避免发出空白说明。
      - name: Build release notes from CHANGELOG
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*' "$VERSION^" 2>/dev/null || true)
          PREVIOUS_TAG="$PREVIOUS_TAG" node scripts/release-notes.cjs "$VERSION" > release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create release with plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Obsidian 与 BRAT 只认 Release 里直接挂的 main.js / manifest.json / styles.css，
          # GitHub 自动附带的 Source code.zip 不能当插件包用。
          EXISTING=$(gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [ "$EXISTING" = "false" ]; then
            echo "Release $VERSION 已正式发布，不覆盖已有产物" >&2
            exit 1
          fi
          if [ "$EXISTING" = "true" ]; then
            echo "发现同名草稿 Release，补齐三件套后发布"
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
            gh release edit "$VERSION" \
              --draft=false \
              --title "Amos Extension Manager $VERSION" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$VERSION" \
              main.js manifest.json styles.css \
              --verify-tag \
              --title "Amos Extension Manager $VERSION" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$VERSION" --json tagName,isDraft,assets \
            --jq '"tag=\(.tagName) draft=\(.isDraft)", (.assets[] | "\(.name) \(.size) bytes")'
          for f in main.js manifest.json styles.css; do
            gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -qx "$f" \
              || { echo "缺少产物 $f" >&2; exit 1; }
          done
